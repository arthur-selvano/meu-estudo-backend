services:
  postgres:
    image: postgres:16-alpine
    container_name: meuestudos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: meuestudos_user
      POSTGRES_PASSWORD: meuestudos_password
      POSTGRES_DB: meuestudos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meuestudos_user -d meuestudos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: