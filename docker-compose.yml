services:
  postgres:
    image: postgres:16-alpine
    container_name: meuestudos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
    # Expõe o banco apenas no loopback da máquina de desenvolvimento.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  # Opcional: sobe a API em container junto com o Postgres.
  # Uso: docker compose --profile app up -d --build
  # Sem o profile, o comportamento antigo continua igual (só o Postgres).
  #
  # Este profile usa ASPNETCORE_ENVIRONMENT=Development e serve apenas para
  # desenvolvimento local. Nunca o utilize como configuração de produção.
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meuestudos-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: 5123
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${Jwt__Key:?Defina Jwt__Key no arquivo .env}
      Jwt__Issuer: ${Jwt__Issuer:-MeuEstudo.Api}
      Jwt__Audience: ${Jwt__Audience:-MeuEstudo.Frontend}
    ports:
      - "127.0.0.1:5123:5123"
    volumes:
      - uploads_data:/app/wwwroot/uploads

volumes:
  postgres_data:
  uploads_data:
